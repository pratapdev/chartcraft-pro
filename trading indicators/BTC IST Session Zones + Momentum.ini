//@version=5
indicator("BTC IST Session Zones + Momentum [5yr Backtest]",
     shorttitle="IST+Momentum", overlay=true, max_bars_back=500)

// ═══════════════════════════════════════════════════════════
// INPUTS — SESSION ZONES (all times IST = UTC+5:30)
// ═══════════════════════════════════════════════════════════
grp_sess = "Session Zones (IST)"
show_prime  = input.bool(true,  "Show Prime zone (00:00–03:30)",  group=grp_sess)
show_asia   = input.bool(true,  "Show Asia Open (05:30–08:00)",   group=grp_sess)
show_spike  = input.bool(true,  "Show 11:00 Spike zone",          group=grp_sess)
show_eve    = input.bool(true,  "Show Evening build (22:00–00:00)",group=grp_sess)
show_avoid  = input.bool(true,  "Show Avoid zone (09:00–17:00)",   group=grp_sess)

col_prime   = input.color(color.new(#FF5000,88), "Prime color",   group=grp_sess)
col_asia    = input.color(color.new(#00C076,90), "Asia color",    group=grp_sess)
col_spike   = input.color(color.new(#FFD700,90), "Spike color",   group=grp_sess)
col_eve     = input.color(color.new(#9C5FD4,90), "Evening color", group=grp_sess)
col_avoid   = input.color(color.new(#787878,94), "Avoid color",   group=grp_sess)

// ═══════════════════════════════════════════════════════════
// INPUTS — MOMENTUM DETECTION
// ═══════════════════════════════════════════════════════════
grp_mom = "Momentum Detection"
atr_len     = input.int(14,   "ATR length",             minval=5,  group=grp_mom)
atr_mult    = input.float(1.5,"ATR multiplier (range)",  minval=0.5,step=0.1, group=grp_mom,
     tooltip="Candle must span > ATR × this value to qualify as impulse")
body_ratio  = input.float(60, "Min body ratio %",        minval=30, maxval=95, group=grp_mom,
     tooltip="Body / total range must exceed this % — filters wicks-only candles")
vol_filter  = input.bool(true, "Require volume spike",   group=grp_mom)
vol_mult    = input.float(1.5, "Volume spike multiplier",minval=1.0,step=0.1, group=grp_mom)
vol_len     = input.int(20,    "Volume MA length",        minval=5,  group=grp_mom)

show_bull   = input.bool(true, "Show bullish signals",   group=grp_mom)
show_bear   = input.bool(true, "Show bearish signals",   group=grp_mom)
show_labels = input.bool(true, "Show velocity labels",   group=grp_mom)

// MTF confirmation
grp_mtf = "Multi-Timeframe"
use_mtf     = input.bool(false,"Enable HTF trend filter", group=grp_mtf,
     tooltip="Only show signals aligned with the HTF trend (EMA200)")
htf_tf      = input.timeframe("60","HTF timeframe",       group=grp_mtf)

// Alert
grp_alert = "Alerts"
alert_prime_only = input.bool(false,"Alert only during Prime/Asia zones",group=grp_alert)

// ═══════════════════════════════════════════════════════════
// IST TIME HELPERS (IST = UTC + 5h30m)
// ═══════════════════════════════════════════════════════════
ist_time   = time + 5.5 * 60 * 60 * 1000     // epoch ms shifted to IST
ist_hour   = hour(ist_time, "UTC")             // 0..23
ist_minute = minute(ist_time, "UTC")           // 0..59
ist_hm     = ist_hour * 100 + ist_minute       // e.g. 0130 = 01:30 IST

// ═══════════════════════════════════════════════════════════
// SESSION ZONE FLAGS
// ═══════════════════════════════════════════════════════════
// Prime: 00:00 – 03:30 IST  (NYSE close flows in)
is_prime    = ist_hm >= 0    and ist_hm < 330

// Asia open: 05:30 – 08:00 IST
is_asia     = ist_hm >= 530  and ist_hm < 800

// 11:00 spike zone: 11:00 – 12:00 IST
is_spike    = ist_hm >= 1100 and ist_hm < 1200

// Evening build: 22:00 – 00:00 IST  (pre-prime build-up)
is_eve      = ist_hm >= 2200

// Avoid: 09:00 – 17:00 IST  (London dead zone for BTC)
is_avoid    = ist_hm >= 900  and ist_hm < 1700

// ═══════════════════════════════════════════════════════════
// BACKGROUND COLORING
// ═══════════════════════════════════════════════════════════
bgcolor(show_prime and is_prime  ? col_prime : na, title="Prime zone bg")
bgcolor(show_asia  and is_asia   ? col_asia  : na, title="Asia zone bg")
bgcolor(show_spike and is_spike  ? col_spike : na, title="Spike zone bg")
bgcolor(show_eve   and is_eve    ? col_eve   : na, title="Evening zone bg")
bgcolor(show_avoid and is_avoid  ? col_avoid : na, title="Avoid zone bg")

// ═══════════════════════════════════════════════════════════
// SESSION LABELS (on first bar of each zone)
// ═══════════════════════════════════════════════════════════
prev_ist_hm = ist_hm[1]

label_style = label.style_label_right
label_size  = size.small

if show_prime and ist_hm == 0 and prev_ist_hm != 0
    label.new(bar_index, high + ta.atr(14),
         "◆ PRIME 00:00 IST",
         color=col_prime, textcolor=color.white, style=label_style, size=label_size)

if show_asia and ist_hm == 530 and prev_ist_hm < 530
    label.new(bar_index, high + ta.atr(14),
         "◆ ASIA 05:30 IST",
         color=col_asia, textcolor=color.white, style=label_style, size=label_size)

if show_spike and ist_hm == 1100 and prev_ist_hm < 1100
    label.new(bar_index, high + ta.atr(14),
         "◆ SPIKE 11:00 IST",
         color=col_spike, textcolor=color.black, style=label_style, size=label_size)

if show_eve and ist_hm == 2200 and prev_ist_hm < 2200
    label.new(bar_index, high + ta.atr(14),
         "◆ EVE BUILD 22:00 IST",
         color=col_eve, textcolor=color.white, style=label_style, size=label_size)

if show_avoid and ist_hm == 900 and prev_ist_hm < 900
    label.new(bar_index, low - ta.atr(14),
         "✕ AVOID 09:00 IST",
         color=col_avoid, textcolor=color.white, style=label.style_label_right, size=label_size)

// ═══════════════════════════════════════════════════════════
// MOMENTUM DETECTION
// ═══════════════════════════════════════════════════════════
atr_val   = ta.atr(atr_len)
vol_ma    = ta.sma(volume, vol_len)

candle_range = high - low
candle_body  = math.abs(close - open)
body_pct     = candle_body / candle_range * 100

is_big_range = candle_range > atr_val * atr_mult
is_clean_body= body_pct >= body_ratio
is_vol_spike = not vol_filter or volume > vol_ma * vol_mult

is_bull_candle = close > open
is_bear_candle = close < open

// Velocity proxy: % move per bar normalised to %/hour
// (on 5m chart: 1 bar = 5min, so multiply by 12 to get hourly rate)
velocity_pct_hr = candle_range / close * 100 * 12

// Momentum conditions
bull_momentum = is_big_range and is_clean_body and is_vol_spike and is_bull_candle
bear_momentum = is_big_range and is_clean_body and is_vol_spike and is_bear_candle

// ═══════════════════════════════════════════════════════════
// HTF TREND FILTER (optional)
// ═══════════════════════════════════════════════════════════
htf_close   = request.security(syminfo.tickerid, htf_tf, close)
htf_ema200  = request.security(syminfo.tickerid, htf_tf, ta.ema(close, 200))
htf_bullish = htf_close > htf_ema200
htf_bearish = htf_close < htf_ema200

bull_final  = bull_momentum and (not use_mtf or htf_bullish)
bear_final  = bear_momentum and (not use_mtf or htf_bearish)

// ═══════════════════════════════════════════════════════════
// CANDLE HIGHLIGHT + ARROWS
// ═══════════════════════════════════════════════════════════
barcolor(show_bull and bull_final ? color.new(#00C076, 0) : na)
barcolor(show_bear and bear_final ? color.new(#FF4040, 0) : na)

plotshape(show_bull and bull_final,
     title="Bull Momentum",
     location=location.belowbar,
     style=shape.triangleup,
     color=color.new(#00C076, 0),
     size=size.small,
     text="M↑")

plotshape(show_bear and bear_final,
     title="Bear Momentum",
     location=location.abovebar,
     style=shape.triangledown,
     color=color.new(#FF4040, 0),
     size=size.small,
     text="M↓")

// ═══════════════════════════════════════════════════════════
// VELOCITY LABEL
// ═══════════════════════════════════════════════════════════
if show_labels and (bull_final or bear_final)
    vel_str   = str.tostring(math.round(velocity_pct_hr, 2))
    sess_name = is_prime ? "PRIME" : is_asia ? "ASIA" : is_spike ? "SPIKE" : is_eve ? "EVE" : "—"
    lbl_txt   = vel_str + "%/hr\n" + sess_name
    lbl_col   = bull_final ? color.new(#00C076,10) : color.new(#FF4040,10)
    lbl_y     = bull_final ? low  - atr_val * 1.2 : high + atr_val * 1.2
    lbl_style = bull_final ? label.style_label_up : label.style_label_down
    label.new(bar_index, lbl_y, lbl_txt,
         color=lbl_col, textcolor=color.white,
         style=lbl_style, size=size.tiny)

// ═══════════════════════════════════════════════════════════
// ATR BAND — shows current impulse threshold
// ═══════════════════════════════════════════════════════════
// Optional visual: plot ATR bands around mid-price
plot(high + atr_val * atr_mult, "ATR Upper",
     color=color.new(#888888,90), linewidth=1)
plot(low  - atr_val * atr_mult, "ATR Lower",
     color=color.new(#888888,90), linewidth=1)

// ═══════════════════════════════════════════════════════════
// ALERTS
// ═══════════════════════════════════════════════════════════
active_zone  = is_prime or is_asia or is_spike or is_eve
prime_filter = not alert_prime_only or active_zone

alertcondition(bull_final and prime_filter,
     title="Bull Impulse Signal",
     message="BTC Bull Momentum — {{ticker}} {{interval}}\nVelocity: {{close}} | IST zone active | Check chart")

alertcondition(bear_final and prime_filter,
     title="Bear Impulse Signal",
     message="BTC Bear Momentum — {{ticker}} {{interval}}\nVelocity: {{close}} | IST zone active | Check chart")

alertcondition((bull_final or bear_final) and is_prime,
     title="Impulse in PRIME Zone (00:00–03:30 IST)",
     message="PRIME ZONE signal — {{ticker}} | {{timenow}}")

alertcondition((bull_final or bear_final) and is_asia,
     title="Impulse in ASIA Zone (05:30–08:00 IST)",
     message="ASIA ZONE signal — {{ticker}} | {{timenow}}")
